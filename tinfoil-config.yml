# One bounded synthetic task; no arbitrary prompts, code execution, or files API.
cvm-version: 0.14.14
cpus: 2
memory: 8192

networks:
  internal:
    egress: closed
  inference:
    egress: allowlist
    allow:
      - atc.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev
      - inference.tinfoil.sh
      - router-0.tinfoil.sh
      - router.inf6.tinfoil.sh

containers:
  - name: runner
    image: ghcr.io/theforkproject-dev/goose-tinfoil-lab@sha256:13171b3267381b2bf23e4af264f43f7930a736be3f3fd0ee10755a51b95b6337
    user: "1000:1000"
    env:
      - ROLE: runner
    networks: [internal]
    read_only: true
    ipc: none
    tmpfs:
      /tmp: "size=256m"
    memory: "2g"
    cpus: 1
    pids_limit: 96
    restart: "no"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  - name: broker
    image: ghcr.io/theforkproject-dev/goose-tinfoil-lab@sha256:13171b3267381b2bf23e4af264f43f7930a736be3f3fd0ee10755a51b95b6337
    user: "1000:1000"
    env:
      - ROLE: broker
    secrets:
      - GOOSE_TEST_TOKEN
    networks: [internal, inference]
    read_only: true
    ipc: none
    tmpfs:
      /tmp: "size=64m"
    memory: "1g"
    cpus: 1
    pids_limit: 48
    restart: "no"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

shim:
  upstream-container: broker
  upstream-port: 8081
  paths:
    - /health
    - /configure
    - /run
    - /result
