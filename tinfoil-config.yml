# Governed synthetic local upload and exact-source retrieval; public receipts only.
cvm-version: 0.14.14
cpus: 2
memory: 8192

attested-keys:
  - id: audit-signing
    key: ed25519
    uid: 1000
    gid: 1000

networks:
  internal:
    egress: closed
  inference:
    egress: allowlist
    allow:
      - atc.tinfoil.sh
      - tuf-repo-cdn.sigstore.dev
      - inference.tinfoil.sh
      - router-0.tinfoil.sh
      - router.inf6.tinfoil.sh
      - doc-upload-inf6.tinfoil.containers.tinfoil.dev
      - attexa-witness-miniature-345337478194-us-east-1-an.s3.us-east-1.amazonaws.com

containers:
  - name: runner
    image: ghcr.io/theforkproject-dev/goose-tinfoil-lab@sha256:264af21811b9e43c5c90544fb530a6bee342435e4014073c19d4151b82abfb39
    user: "1000:1000"
    env:
      - ROLE: runner
      - CHAT_MODE: "document-v1"
    networks: [internal]
    read_only: true
    ipc: none
    tmpfs:
      /tmp: "size=1g"
    memory: "2g"
    cpus: 1
    pids_limit: 96
    restart: "no"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  - name: broker
    keys: [audit-signing]
    image: ghcr.io/theforkproject-dev/goose-tinfoil-lab@sha256:264af21811b9e43c5c90544fb530a6bee342435e4014073c19d4151b82abfb39
    user: "1000:1000"
    env:
      - ROLE: broker
      - CHAT_MODE: "document-v1"
    secrets:
      - GOOSE_TEST_TOKEN
    networks: [internal, inference]
    read_only: true
    ipc: none
    tmpfs:
      /tmp: "size=2g"
    memory: "4g"
    cpus: 1
    pids_limit: 48
    restart: "no"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

shim:
  upstream-container: broker
  upstream-port: 8081
  paths:
    - /health
    - /configure
    - /chat/info
    - /chat/open
    - /chat/refresh
    - /chat/state
    - /chat/turn
    - /chat/result
    - /chat/cancel
    - /chat/events
    - /documents/prepare
    - /documents/content
    - /documents/status
    - /documents/configure-source
